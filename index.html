<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CloudTasks, aplicacion web para gestionar tareas personales y de equipo.">

    <title>CloudTasks</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <a class="skip-link" href="#lista-tareas">Ir a mis tareas</a>

    <header class="topbar">

        <div class="topbar__inner">

            <div class="brand">
                <svg class="brand__mark" viewBox="0 0 32 32" role="img" aria-label="Logotipo de CloudTasks">
                    <rect width="32" height="32" rx="9"></rect>
                    <path d="M9 16.5l4.5 4.5L23 11.5" fill="none" stroke="#fff" stroke-width="2.6"
                        stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>

                <div class="brand__text">
                    <h1 class="brand__name">CloudTasks</h1>
                    <p class="brand__tagline">Gestion de tareas personales y de equipo</p>
                </div>
            </div>

            <p class="topbar__summary" id="resumen" aria-live="polite">Cargando tus tareas.</p>

        </div>

    </header>

    <main class="layout">

        <!-- Formulario de creacion de tareas -->
        <section class="panel panel--form" aria-labelledby="titulo-formulario">

            <h2 class="panel__title" id="titulo-formulario">Nueva tarea</h2>

            <form class="form" id="formulario-tarea" novalidate>

                <div class="field">
                    <label class="field__label" for="title">Titulo</label>
                    <input class="field__input" type="text" id="title" name="title" maxlength="80"
                        placeholder="Configurar el repositorio en GitHub" autocomplete="off"
                        aria-describedby="error-title">
                    <p class="field__error" id="error-title" role="alert"></p>
                </div>

                <div class="field">
                    <label class="field__label" for="description">Descripcion</label>
                    <textarea class="field__input field__input--area" id="description" name="description" rows="3"
                        maxlength="280" placeholder="Que hay que hacer exactamente"
                        aria-describedby="error-description"></textarea>
                    <p class="field__error" id="error-description" role="alert"></p>
                </div>

                <div class="field-row">

                    <div class="field">
                        <label class="field__label" for="deadline">Fecha limite</label>
                        <input class="field__input" type="date" id="deadline" name="deadline"
                            aria-describedby="error-deadline">
                        <p class="field__error" id="error-deadline" role="alert"></p>
                    </div>

                    <div class="field">
                        <label class="field__label" for="priority">Prioridad</label>
                        <select class="field__input" id="priority" name="priority" aria-describedby="error-priority">
                            <option value="">Elegir</option>
                            <option value="low">Baja</option>
                            <option value="medium">Media</option>
                            <option value="high">Alta</option>
                        </select>
                        <p class="field__error" id="error-priority" role="alert"></p>
                    </div>

                </div>

                <button class="button button--primary" type="submit">Crear tarea</button>

                <p class="form__status" id="estado-formulario" role="status"></p>

            </form>

        </section>

        <!-- Listado de tareas -->
        <section class="panel panel--list" aria-labelledby="titulo-lista">

            <div class="list__head">

                <h2 class="panel__title" id="titulo-lista">Mis tareas</h2>

                <div class="filters" role="group" aria-label="Filtrar tareas">
                    <button class="filter is-active" type="button" data-filter="all" aria-pressed="true">
                        Todas <span class="filter__count" data-count="all">0</span>
                    </button>
                    <button class="filter" type="button" data-filter="pending" aria-pressed="false">
                        Pendientes <span class="filter__count" data-count="pending">0</span>
                    </button>
                    <button class="filter" type="button" data-filter="completed" aria-pressed="false">
                        Completadas <span class="filter__count" data-count="completed">0</span>
                    </button>
                </div>

            </div>

            <ul class="tasks" id="lista-tareas"></ul>

            <p class="empty" id="estado-vacio" hidden></p>

        </section>

    </main>

    <footer class="footer">
        <p id="nota-persistencia">Etapa 1, ejecucion local. Las tareas se guardan en el almacenamiento de este
            navegador.</p>
    </footer>

    <script src="js/app.js"></script>

</body>

</html>
